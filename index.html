<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Maikel García — Desarrollador Full-Stack freelance especializado en Python, React, web scraping y automatización." />
    <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <!-- Social preview. Absolute URLs on https://maikeldev.site, matching
         public/sitemap.xml and public/robots.txt.

         These og:/twitter: tags are read from raw HTML by scrapers that do NOT
         execute JavaScript. Unlike <title> and meta[name="description"], which
         src/App.jsx rewrites per route after mount, they can never become
         per-route in a client-rendered app: og:url is therefore always the root.
         Making them route-specific needs real per-route HTML, not setAttribute.

         og:image must be a raster. Facebook, X and LinkedIn do not render SVG
         og:images, so public/img/og-image.png is a 1200x630 PNG rasterised from
         coding.svg on the --bg-dark background. It carries no text; the title and
         description below are what the card shows. Replace it with a designed
         card when one exists.

         No hreflang alternates: language is client-side only (src/i18n.js reads
         localStorage/navigator) and there is one URL per route, so every alternate
         would resolve to the same document. Google ignores such a set. Add them
         when the site serves a distinct URL per language. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://maikeldev.site/" />
    <meta property="og:title" content="Maikel García - Desarrollador Full-Stack Freelance" />
    <meta property="og:description" content="Maikel García — desarrollador Full-Stack freelance especializado en Python, React, web scraping y automatización." />
    <meta property="og:image" content="https://maikeldev.site/img/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ilustración de programación" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:site_name" content="Maikel García" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://maikeldev.site/img/og-image.png" />
    <title>Maikel García - Desarrollador Full-Stack Freelance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
