<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Maikel García - Desarrollador Full-Stack Freelance</title>
    <script>
      // GitHub Pages has no rewrite rules: it serves this file, with a 404 status,
      // for any path that is not a real file on the branch. Without this, the SPA's
      // deep links (/projects) would be dead on a cold load.
      //
      // Stash the requested path, then bounce to the app root, which IS a real file.
      // src/main.jsx restores the path with history.replaceState before React Router
      // mounts, so the URL bar and the rendered route end up correct.
      //
      // APP_ROOT must match `base` in vite.config.js. It used to be '/portfolio/',
      // the GitHub Pages project subdirectory, and is now '/' because maikeldev.site
      // serves the app from the domain root. It stays hardcoded rather than derived
      // from location.pathname: a dirname computation sends '/portfolio' to the
      // domain root, which is wrong there but indistinguishable here, so deriving it
      // would trade an explicit value for a subtle one.
      (function () {
        var APP_ROOT = '/'
        var KEY = 'gh-pages:cold-link-path'
        var location = window.location

        // Already at (or heading to) the app root: nothing to do. Without this guard
        // the redirect would target itself forever.
        if (location.pathname === APP_ROOT) return

        try {
          window.sessionStorage.setItem(KEY, location.pathname + location.search + location.hash)
        } catch (error) {
          // Storage blocked (private mode): the app still loads, just at the root.
        }
        location.replace(APP_ROOT)
      })()
    </script>
  </head>
  <body>
    <p>Redirigiendo&hellip; Si no ocurre, <a href="./">abre el portafolio</a>.</p>
  </body>
</html>
